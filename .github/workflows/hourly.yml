name: Indodax dry-run hourly tick

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: indodax-dryrun-hourly
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_URL: ${{ secrets.VERCEL_BOT_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip until secrets are configured
        if: ${{ env.BOT_URL == '' || env.CRON_SECRET == '' }}
        run: |
          echo "Skipped: configure VERCEL_BOT_URL and CRON_SECRET repository secrets to enable dry-run ticks."
      - name: Run dry-run tick
        if: ${{ env.BOT_URL != '' && env.CRON_SECRET != '' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 240 --request POST --header "Authorization: Bearer ${CRON_SECRET}" "${BOT_URL}/api/tick"
