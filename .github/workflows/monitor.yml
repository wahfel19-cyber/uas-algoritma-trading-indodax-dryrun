name: Monitor Indodax dry-run bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: indodax-dryrun-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_URL: https://uas-algoritma-trading-indodax-dryru.vercel.app
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check health, metrics, and scheduled tick
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          base = os.environ["BOT_URL"].rstrip("/")

          def get_json(url, headers=None):
              request = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          health = get_json(base + "/api/health")
          if health.get("status") != "ok" or health.get("indodax_public_api") != "reachable":
              raise SystemExit("Health check failed: " + json.dumps(health))
          if health.get("universe_pairs_available", 0) < 5:
              raise SystemExit("Not all five configured market pairs are available")

          metrics = get_json(base + "/api/metrics")
          operations = metrics.get("operations") or {}
          if not metrics.get("data_available"):
              raise SystemExit("Metrics endpoint reports no source data")
          if operations.get("calls", 0) < 1:
              raise SystemExit("No bot tick has been recorded")
          if operations.get("api_errors", 0) > 0:
              raise SystemExit("Forward window contains API/operational errors")

          repository = urllib.parse.quote(os.environ["GH_REPOSITORY"], safe="/")
          url = (
              "https://api.github.com/repos/" + repository
              + "/actions/workflows/hourly.yml/runs?branch=main&event=schedule&per_page=5"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }
          runs = get_json(url, headers).get("workflow_runs", [])
          if not runs:
              raise SystemExit("No scheduled hourly tick run is visible")
          latest = runs[0]
          created = datetime.fromisoformat(latest["created_at"].replace("Z", "+00:00"))
          age_minutes = (datetime.now(timezone.utc) - created).total_seconds() / 60
          if age_minutes > 75:
              raise SystemExit(f"Latest scheduled tick is stale ({age_minutes:.0f} minutes old)")
          if latest.get("status") != "completed" or latest.get("conclusion") != "success":
              raise SystemExit(
                  "Latest scheduled tick is not successful: "
                  + str(latest.get("status")) + "/" + str(latest.get("conclusion"))
              )
          print(
              "Monitor OK: Indodax health reachable; metrics available; "
              f"{operations.get('calls')} bot calls recorded; latest scheduled tick "
              f"succeeded {age_minutes:.0f} minutes ago."
          )
          PY
